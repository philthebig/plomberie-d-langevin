<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-label="Plomberie D.Langevin">
  <rect width="800" height="620" fill="#ffffff"/>

  <g transform="translate(400 208)">
    <!-- Pipe wrench behind the house: head NW, handle SE -->
    <g transform="translate(-28 -18) rotate(-44)" fill="#9c9c9c" stroke="#2a2a2a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -22 48 L 22 48 L 17 268 C 17 286 -17 286 -17 268 Z"/>
      <path d="M -28 -12 L 30 -12 L 30 56 L -28 56 Z"/>
      <path d="M -102 8 L -28 8 L -28 56 L -82 56 L -102 34 Z"/>
      <path fill="#8a8a8a" d="M -28 -12 L -28 -78 L -86 -78 C -132 -78 -146 -18 -104 2 L -62 2 L -62 -36 L -46 -36 L -46 -12 Z"/>
      <circle cx="10" cy="22" r="13" fill="#7a7a7a"/>
      <rect x="4" y="8" width="12" height="28" rx="1" fill="#656565"/>
    </g>

    <!-- House (white fill so the wrench reads as behind) -->
    <path
      fill="#ffffff"
      stroke="#2a2a2a"
      stroke-width="11"
      stroke-linejoin="miter"
      d="M -138 30 L 0 -122 L 92 -48 L 92 -82 L 122 -82 L 122 -22 L 138 30 L 138 138 L -138 138 Z"
    />

    <!-- Faucet + droplet, centered in the house -->
    <g fill="#6c6c6c" stroke="#2a2a2a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path fill="#5a5a5a" d="M 4 8 C 4 8 -18 38 4 54 C 26 38 4 8 4 8 Z"/>
      <rect x="-28" y="70" width="24" height="48" rx="3"/>
      <path d="M -6 74 L 48 74 C 62 74 66 88 52 96 L 40 96 C 46 96 46 88 40 86 L -6 86 Z"/>
      <rect x="40" y="86" width="16" height="14" rx="2"/>
      <rect x="-36" y="78" width="10" height="20" rx="2"/>
    </g>
  </g>

  <g font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="428" font-size="64" font-weight="700" fill="#1a1a1a" letter-spacing="6">PLOMBERIE</text>
    <text x="400" y="498" font-size="50" font-weight="700" fill="#7a7a7a" letter-spacing="8">D.LANGEVIN</text>
    <line x1="150" y1="514" x2="650" y2="514" stroke="#7a7a7a" stroke-width="4"/>
    <text x="400" y="562" font-size="26" font-weight="700" fill="#8a8a8a" letter-spacing="2.5">DANIEL LANGEVIN | PLOMBIER</text>
  </g>
</svg>
